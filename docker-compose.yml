services:
  jellysignal:
    # Use the pre-built image from GitHub Container Registry
    # To build locally instead, comment out "image" and uncomment "build"
    image: ghcr.io/sentientsoup/jellysignal:latest
    # build: .
    container_name: jellysignal
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL:-http://jellyfin:8096}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - DATABASE_URL=file:/app/data/jellysignal.db
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - jellysignal-data:/app/data
    # Uncomment if Jellyfin is on the same Docker network
    # networks:
    #   - jellyfin_network

volumes:
  jellysignal-data:

# Uncomment to connect to existing Jellyfin network
# networks:
#   jellyfin_network:
#     external: true
